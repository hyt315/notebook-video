name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: assets/example-project/package-lock.json
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Check launchers and scripts
        run: |
          node --check scripts/notebook-video.mjs
          for file in scripts/*.sh; do bash -n "$file"; done
          python3 -c "from pathlib import Path; [compile(path.read_text(encoding='utf-8'), str(path), 'exec') for path in Path('scripts').glob('*.py')]"
      - name: Validate skill and official example
        run: |
          test -z "$(find . -type d \( -name node_modules -o -name .tools -o -name .cache -o -name renders -o -name __pycache__ \) -print -quit)"
          node scripts/notebook-video.mjs check-deps
          node scripts/notebook-video.mjs validate-skill
          node scripts/notebook-video.mjs validate-official-example
          node scripts/notebook-video.mjs validate-visual-plan assets/example-project
          python3 scripts/selftest.py
      - name: Run the build-time gates on the default template
        # ⚠️ 复核发现：CI 之前**一条构建期门禁都不跑**（只有 validate-skill / official-example /
        # visual-plan 与 selftest），于是「负向抽查」长期只是本地仪式。
        # 这里把模板上的 6 道构建期门禁全挂上：呈现效果 / 帧参数名 / 构图 / 镜头运动 / 音效电平 / 字幕同步。
        run: |
          node scripts/notebook-video.mjs validate-frame-props assets/lecture-template
          node scripts/notebook-video.mjs validate-composition assets/lecture-template
          node scripts/notebook-video.mjs validate-shot-motion assets/lecture-template
          node scripts/notebook-video.mjs validate-presentation assets/lecture-template
          node scripts/notebook-video.mjs validate-audio-levels assets/lecture-template
          node scripts/notebook-video.mjs validate-caption-sync assets/lecture-template/audio/narration.mp3.json assets/lecture-template/manifests/caption-cues.json
          node scripts/notebook-video.mjs validate-semantic-breaks assets/lecture-template/manifests/caption-cues.json assets/lecture-template/manifests/protected-caption-phrases.txt
      - name: Run the negative fixtures (every gate must really block)
        # 「名存实亡的门禁是最危险的缺陷」——这一条保障每道门禁都有"喂坏输入必须拦住"的实证。
        run: python3 scripts/negative-gate-check.py assets/lecture-template
      - name: Check the coordinate reporter stays green in strict mode
        run: python3 scripts/coords-lint.py assets/lecture-template
      - name: Audit locked dependencies
        working-directory: assets/example-project
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high
      - name: Smoke-test project creation
        run: |
          mkdir "$RUNNER_TEMP/notebook-video-smoke"
          node scripts/notebook-video.mjs new-project "$RUNNER_TEMP/notebook-video-smoke"
          test -f "$RUNNER_TEMP/notebook-video-smoke/src/index.tsx"
          test -f "$RUNNER_TEMP/notebook-video-smoke/public/LICENSE-OFL-1.1-LXGW.txt"
          test -f "$RUNNER_TEMP/notebook-video-smoke/scripts/tts-openai-compatible.py"
          test -f "$RUNNER_TEMP/notebook-video-smoke/manifests/visual-assets.json"
          test ! -f "$RUNNER_TEMP/notebook-video-smoke/public/illustrations/visual-director.png"
          node scripts/notebook-video.mjs validate-visual-plan "$RUNNER_TEMP/notebook-video-smoke"
          mkdir "$RUNNER_TEMP/notebook-video-smoke-classic"
          node scripts/notebook-video.mjs new-project "$RUNNER_TEMP/notebook-video-smoke-classic" --classic
          test -f "$RUNNER_TEMP/notebook-video-smoke-classic/src/index.tsx"
          test -f "$RUNNER_TEMP/notebook-video-smoke-classic/public/LICENSE-OFL-1.1-LXGW.txt"
          test -f "$RUNNER_TEMP/notebook-video-smoke-classic/public/illustrations/visual-director.png"
          test -f "$RUNNER_TEMP/notebook-video-smoke-classic/manifests/visual-assets.json"
          mkdir "$RUNNER_TEMP/notebook-video-smoke-cel"
          node scripts/notebook-video.mjs new-project "$RUNNER_TEMP/notebook-video-smoke-cel" --style=cel
          test -f "$RUNNER_TEMP/notebook-video-smoke-cel/src/theme/cel.tsx"
          grep -q "from './cel'" "$RUNNER_TEMP/notebook-video-smoke-cel/src/theme/active.ts"
          awk 'NR==1{print}' "$RUNNER_TEMP/notebook-video-smoke-cel/src/theme/active.ts" | grep -q "import"
